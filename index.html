<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #e5e5e5;
      --accent: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    .links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .links a:hover {
      border-color: var(--accent);
      background: #fafafa;
    }

    .label {
      font-weight: 500;
      font-size: 1rem;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- PLACEHOLDER: Replace "Your Name" and the tagline with your own details -->
    <h1>Your Name</h1>
    <p class="tagline">Your role or short description</p>

    <ul class="links">
      <li>
        <!-- PLACEHOLDER: Replace with your Instagram profile URL, e.g. https://www.instagram.com/yourhandle -->
        <a href="https://www.instagram.com/himanshumishra3071/" target="_blank" rel="noopener noreferrer">
          <span class="label">Instagram</span>
          <span class="hint"></span>
        </a>
      </li>
      <li>
        <!-- PLACEHOLDER: Replace with your LinkedIn profile URL, e.g. https://www.linkedin.com/in/yourname -->
        <a href="https://www.linkedin.com/in/himanshu-mishra01/" target="_blank" rel="noopener noreferrer">
          <span class="label">LinkedIn</span>
          <span class="hint">Replace with your LinkedIn profile URL</span>
        </a>
      </li>
      <li>
        <!-- PLACEHOLDER: Replace with your portfolio website URL, e.g. https://yourportfolio.com -->
        <a href="https://himanshu3071.netlify.app/" target="_blank" rel="noopener noreferrer">
          <span class="label">Portfolio</span>
          <span class="hint">Replace with your portfolio website URL</span>
        </a>
      </li>
      <li>
        <!-- PLACEHOLDER: Replace 1234567890 with your number in international format, digits only, including country code (e.g. 919876543210 for India) -->
        <a href="https://wa.me/8960194225" target="_blank" rel="noopener noreferrer">
          <span class="label">WhatsApp</span>
          <span class="hint">Replace with your number, country code first, digits only</span>
        </a>
      </li>
    </ul>

    <footer>
      <!-- PLACEHOLDER: Optional footer text, such as your email or location -->
      &copy; Himanshu Mishra
    </footer>
  </main>
</body>
</html>
